<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500&family=Noto+Serif+KR:wght@700&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #FBF6EC; }
  .og { box-sizing: border-box; width: 1200px; height: 630px; padding: 0 96px; display: flex; align-items: center; gap: 72px; border-bottom: 14px solid #7A4E2D; }
  .og svg { width: 360px; height: 360px; flex: none; }
  .copy { display: grid; gap: 22px; word-break: keep-all; }
  h1 { margin: 0; font: 700 56px/1.3 "Noto Serif KR", serif; color: #2B211A; }
  p { margin: 0; font: 500 28px/1.5 "Noto Sans KR", sans-serif; color: #6B5A4C; }
  .dot { color: #C8462B; }
</style>
<div class="og">
  {{LOGO}}
  <div class="copy">
    <h1>매일의 식사에<br>온기를 담다</h1>
    <p>양주 무인 반찬가게 <span class="dot">·</span> 미리 결제하고<br>퇴근길에 찾아가세요</p>
  </div>
</div>
