<style>
:root{--mark:#0E4A84;--accent:#C8A24A;--knock:#fff}
.ph{position:relative;background:linear-gradient(135deg,#123d6b 0%,#0e4a84 45%,#2f6aa3 100%);background-size:cover;background-position:center;overflow:hidden}
.ph::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 30%,rgba(255,255,255,.16),transparent 55%),
  repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 14px,transparent 14px 28px)}
.ph::after{content:attr(data-label);position:absolute;left:12px;bottom:10px;font:500 11px/1.4 'Noto Sans KR',sans-serif;color:rgba(255,255,255,.75);
  letter-spacing:.04em;background:rgba(0,0,0,.18);padding:2px 8px;border-radius:2px}
.ph.has-img::before,.ph.has-img::after{display:none}
.emblem-ph{display:inline-flex;align-items:center;justify-content:center;text-align:center;border:1px dashed currentColor;opacity:.6;
  font:700 8px/1.15 'Noto Sans KR',sans-serif;letter-spacing:.08em;width:56px;height:36px;border-radius:2px}

:root{--navy:#0E4A84;--deep:#0A2E55;--gold:#C8A24A;--ink:#1A2233;--muted:#5B6475;--line:#E3E6EC;--ivory:#F7F5F0}
*{box-sizing:border-box;margin:0}
body{background:var(--ivory);color:var(--ink);font:400 15px/1.7 'Noto Sans KR',system-ui,sans-serif;word-break:keep-all}
.w{max-width:1280px;margin:0 auto;padding:0 40px}
header{background:var(--deep);color:#fff;padding:40px 0;--mark:#fff;--accent:var(--gold)}
header .w{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
h1{font:900 30px/1.3 'Noto Serif KR',serif} header p{color:#b9c8dc;font-size:14px}
.count{margin-left:auto;font:700 14px/1 'Noto Sans KR';background:rgba(255,255,255,.1);padding:10px 14px;border-radius:2px}
.count b{color:#E2C77F}
main{padding:40px 0 80px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
figure{background:#fff;border:1px solid var(--line);margin:0}
figure .ph{aspect-ratio:3/2}
figcaption{padding:14px 16px 16px}
figcaption b{display:block;font-size:15px} figcaption .meta{font-size:12px;color:var(--muted)}
.st{display:inline-block;font:700 11px/1 'Noto Sans KR';padding:4px 7px;border-radius:2px;margin-right:6px;vertical-align:1px}
.st.ok{background:#E6F2EA;color:#1E6B3A} .st.no{background:#F3F0E6;color:#8A6D1E}
details{margin-top:8px;font-size:12px;color:var(--muted)} summary{cursor:pointer;color:var(--navy)}
@media (max-width:900px){.w{padding:0 20px}.grid{grid-template-columns:1fr 1fr;gap:12px}}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
</style>

<main><div class="w grid"><figure><div class="ph has-img" data-label="대기 · mock-plaque" style="background-image:url(mock-plaque.png)"></div><figcaption><span class="st ok">완료</span><b style="display:inline">mock-plaque</b><div class="meta">확정 인장(D) 황동 명판 목업 · 1536×1024 · 참고: logo/png/logo-D.png<br>figma:gpt-image-2.5-sunburst (빈 배경) + 확정 로고 합성 (scripts/composite_mockups.py)</div><details><summary>프롬프트 보기</summary>Photorealistic product photograph for a brand presentation slide. Background: a modern university media studio corridor, warm grey plaster wall, soft daylight from the left. Subject: a round brushed brass plaque mounted on the wall with the attached circular seal logo engraved and filled with deep navy (#0E4A84) enamel, the small folded corner of the monogram in gold. Details: crisp engraving edges, subtle reflections, shallow depth of field, 50mm lens. Constraints: keep the seal and monogram shape exactly as the reference, no extra text, no university crest, no watermark.</details></figcaption></figure><figure><div class="ph has-img" data-label="대기 · mock-sign" style="background-image:url(mock-sign.png)"></div><figcaption><span class="st ok">완료</span><b style="display:inline">mock-sign</b><div class="meta">A 모노그램 스튜디오 벽 사인 · 1536×1024 · 참고: logo/png/logo-A.png<br>figma:gpt-image-2.5-sunburst (빈 배경) + 확정 로고 합성 (scripts/composite_mockups.py)</div><details><summary>프롬프트 보기</summary>Photorealistic interior photograph. Background: a professional lecture-video recording studio with a teleprompter, softbox lights and a glass lightboard, dark navy acoustic panels. Subject: a large backlit dimensional sign of the attached monogram logo in matte white with a gold accent, mounted on the navy wall. Details: soft halo glow behind the letters, cinematic but natural lighting, eye-level view, 35mm lens. Constraints: logo shape identical to reference, no people, no other logos, no text except &quot;HY FLIP&quot;.</details></figcaption></figure><figure><div class="ph has-img" data-label="대기 · mock-stationery" style="background-image:url(mock-stationery.png)"></div><figcaption><span class="st ok">완료</span><b style="display:inline">mock-stationery</b><div class="meta">D 인장 명함·문구류 · 1536×1024 · 참고: logo/png/logo-D.png<br>figma:gpt-image-2.5-sunburst (빈 배경) + 확정 로고 합성 (scripts/composite_mockups.py)</div><details><summary>프롬프트 보기</summary>Photorealistic flat-lay stationery mockup. Background: ivory textured paper surface (#F7F5F0), soft top-down daylight with gentle shadows. Subject: business cards, an A4 letterhead and a navy folder printed with the attached HY FLIP monogram; gold foil on the monogram accent only. Details: premium cotton paper texture, slight emboss, a fountain pen at the edge. Constraints: monogram identical to reference, no fake Korean text (use simple grey lines for body text), no watermark.</details></figcaption></figure><figure><div class="ph has-img" data-label="대기 · studio-hero" style="background-image:url(studio-hero.png)"></div><figcaption><span class="st ok">완료</span><b style="display:inline">studio-hero</b><div class="meta">상세·홈 히어로 · 1536×1024<br>figma:gpt-image-2.5-sunburst</div><details><summary>프롬프트 보기</summary>Photorealistic photograph of a modern university lecture-video studio. A middle-aged Korean professor in a navy blazer speaks naturally toward a camera with a teleprompter, softbox key light, dark navy acoustic wall, a glass lightboard on the side. Natural skin tones, shallow depth of field, 35mm, calm and trustworthy mood, desaturated navy-grey palette. No logos, no text, no watermark.</details></figcaption></figure><figure><div class="ph has-img" data-label="대기 · flipped-class" style="background-image:url(flipped-class.png)"></div><figcaption><span class="st ok">완료</span><b style="display:inline">flipped-class</b><div class="meta">플립러닝 비교 섹션 · 1536×1024<br>figma:gpt-image-2.5-sunburst</div><details><summary>프롬프트 보기</summary>Photorealistic photograph of a Korean university seminar room during an active discussion class. Korean students in their twenties in small groups around tables, a Korean professor in his 50s walking between them, laptops showing lecture video thumbnails, warm daylight from large windows. Candid moment, nobody looking at camera. East Asian features, natural skin tones. No logos, no readable text.</details></figcaption></figure><figure><div class="ph has-img" data-label="대기 · lightboard" style="background-image:url(lightboard.png)"></div><figcaption><span class="st ok">완료</span><b style="display:inline">lightboard</b><div class="meta">스튜디오 장비 - 라이트보드 · 1024×1024<br>figma:gpt-image-2.5-sunburst</div><details><summary>프롬프트 보기</summary>Photorealistic photograph of a Korean professor in his 50s writing glowing equations on a transparent lightboard in a dark studio, the writing glows soft white and gold, rim light on the professor, black background. No readable brand text.</details></figcaption></figure><figure><div class="ph has-img" data-label="대기 · chroma" style="background-image:url(chroma.png)"></div><figcaption><span class="st ok">완료</span><b style="display:inline">chroma</b><div class="meta">스튜디오 장비 - 크로마키 · 1024×1024<br>figma:gpt-image-2.5-sunburst</div><details><summary>프롬프트 보기</summary>Photorealistic photograph of a green chroma-key studio with a 4K cinema camera on a tripod, LED panel lights and a monitor showing a composited virtual classroom. Clean, professional, no people.</details></figcaption></figure><figure><div class="ph has-img" data-label="대기 · editing" style="background-image:url(editing.png)"></div><figcaption><span class="st ok">완료</span><b style="display:inline">editing</b><div class="meta">스튜디오 장비 - 편집실 · 1024×1024<br>figma:gpt-image-2.5-sunburst</div><details><summary>프롬프트 보기</summary>Photorealistic photograph of a video editor&#x27;s desk with two monitors showing a lecture timeline and AI-generated subtitles, navy ambient light, late afternoon. Screen text unreadable and blurred.</details></figcaption></figure><figure><div class="ph has-img" data-label="대기 · prompter" style="background-image:url(prompter.png)"></div><figcaption><span class="st ok">완료</span><b style="display:inline">prompter</b><div class="meta">스튜디오 장비 - 프롬프터 · 1024×1024<br>figma:gpt-image-2.5-sunburst</div><details><summary>프롬프트 보기</summary>Photorealistic close-up photograph of a broadcast teleprompter mounted on a cinema camera in a dark navy lecture studio, the glass reflecting soft white script lines (unreadable), warm key light in the background. No logos, no readable text.</details></figcaption></figure><figure><div class="ph has-img" data-label="대기 · camera" style="background-image:url(camera.png)"></div><figcaption><span class="st ok">완료</span><b style="display:inline">camera</b><div class="meta">스튜디오 장비 - 4K 카메라 · 1024×1024<br>figma:gpt-image-2.5-sunburst</div><details><summary>프롬프트 보기</summary>Photorealistic product-style photograph of a 4K cinema camera on a tripod in a university recording studio, shallow depth of field, softbox lights blurred in the background, navy and grey tones. No logos, no readable text.</details></figcaption></figure><figure><div class="ph has-img" data-label="대기 · smartboard" style="background-image:url(smartboard.png)"></div><figcaption><span class="st ok">완료</span><b style="display:inline">smartboard</b><div class="meta">스튜디오 장비 - 전자칠판 · 1024×1024<br>figma:gpt-image-2.5-sunburst</div><details><summary>프롬프트 보기</summary>Photorealistic photograph of a large interactive smart board in a modern lecture studio showing a clean colorful diagram, a professor&#x27;s hand with a stylus pointing at it, soft studio lighting. No logos, no readable text.</details></figcaption></figure><figure><div class="ph has-img" data-label="대기 · campus-dusk" style="background-image:url(campus-dusk.png)"></div><figcaption><span class="st ok">완료</span><b style="display:inline">campus-dusk</b><div class="meta">홈 배경 · 1536×1024<br>figma:gpt-image-2.5-sunburst</div><details><summary>프롬프트 보기</summary>Photorealistic wide photograph of a modern Korean university campus at blue hour, glass-and-stone academic building with warm lit windows, a few students walking, deep navy sky. No signage, no logos, no readable text.</details></figcaption></figure><figure><div class="ph has-img" data-label="대기 · thumb-1" style="background-image:url(thumb-1.png)"></div><figcaption><span class="st ok">완료</span><b style="display:inline">thumb-1</b><div class="meta">제작 사례 썸네일 · 1536×1024<br>figma:gpt-image-2.5-sunburst</div><details><summary>프롬프트 보기</summary>Photorealistic still frame from a university lecture video: a professor (Korean woman in her 50s) explaining in front of a clean navy studio backdrop with a subtle on-screen diagram. Broadcast-quality lighting. No readable text, no logos.</details></figcaption></figure><figure><div class="ph has-img" data-label="대기 · thumb-2" style="background-image:url(thumb-2.png)"></div><figcaption><span class="st ok">완료</span><b style="display:inline">thumb-2</b><div class="meta">제작 사례 썸네일 · 1536×1024<br>figma:gpt-image-2.5-sunburst</div><details><summary>프롬프트 보기</summary>Photorealistic still frame from a university lecture video: a professor (Korean man in his 40s) explaining in front of a clean navy studio backdrop with a subtle on-screen diagram. Broadcast-quality lighting. No readable text, no logos.</details></figcaption></figure><figure><div class="ph has-img" data-label="대기 · thumb-3" style="background-image:url(thumb-3.png)"></div><figcaption><span class="st ok">완료</span><b style="display:inline">thumb-3</b><div class="meta">제작 사례 썸네일 · 1536×1024<br>figma:gpt-image-2.5-sunburst</div><details><summary>프롬프트 보기</summary>Photorealistic still frame from a university lecture video: a professor (Korean woman in her 30s) explaining in front of a clean navy studio backdrop with a subtle on-screen diagram. Broadcast-quality lighting. No readable text, no logos.</details></figcaption></figure><figure><div class="ph has-img" data-label="대기 · thumb-4" st
